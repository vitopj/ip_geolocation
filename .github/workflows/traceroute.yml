name: TEST CODE

on:
  workflow_dispatch:

jobs:
  traceroute:
    name: TEST JOB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PROVE WHICH CODE WE HAVE
        run: |
          echo "================================"
          echo "COMMIT USED BY RUNNER:"
          git rev-parse HEAD
          echo "================================"

          echo "LATEST COMMIT:"
          git log -1 --oneline
          echo "================================"

          echo "CLIENT2 LOCATION:"
          find "$GITHUB_WORKSPACE" -name "client2.py" -type f -print
          echo "================================"

          echo "CLIENT2 HASH:"
          sha256sum "$GITHUB_WORKSPACE/client2.py"
          echo "================================"

          echo "LAST 20 LINES OF CLIENT2:"
          tail -20 "$GITHUB_WORKSPACE/client2.py"
          echo "================================"

          echo "RUNNING CLIENT2:"
          python -u "$GITHUB_WORKSPACE/client2.py" --once
