name: Traceroute Measurement

on:
  workflow_dispatch:

jobs:
  traceroute:
    name: Test traceroute methods
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install traceroute
        run: |
          sudo apt-get update
          sudo apt-get install -y traceroute

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test traceroute methods
        run: |
          echo "========================================"
          echo "UDP TRACEROUTE"
          echo "========================================"
          traceroute -n -m 10 -w 2 petagimnazija.hr || true

          echo ""
          echo "========================================"
          echo "ICMP TRACEROUTE"
          echo "========================================"
          sudo traceroute -n -I -m 10 -w 2 petagimnazija.hr || true

          echo ""
          echo "========================================"
          echo "TCP TRACEROUTE PORT 443"
          echo "========================================"
          traceroute -n -T -p 443 -m 10 -w 2 petagimnazija.hr || true

          echo ""
          echo "========================================"
          echo "HTTPS CONNECTIVITY"
          echo "========================================"
          curl -I --connect-timeout 10 https://petagimnazija.hr || true

      - name: Run Python client
        env:
          SERVER: ${{ secrets.SERVER }}
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          TARGET: ${{ vars.TARGET }}
        run: |
          python -u client2.py --once
